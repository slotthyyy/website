<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>yourname</title>
<style>
:root{--bg:#f4f1ea;--fg:#1c1c1c;--dim:#6b665c;--accent:#b4390f;--line:#d6d0c2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0e0f0e;--fg:#d8e0d4;--dim:#7d887a;--accent:#7dff9b;--line:#242824}}
:root[data-theme="dark"]{--bg:#0e0f0e;--fg:#d8e0d4;--dim:#7d887a;--accent:#7dff9b;--line:#242824}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.6 ui-monospace,"SF Mono",Menlo,Consolas,monospace}
main{max-width:640px;margin:0 auto;padding:40px 20px 80px}
h1{font-size:1.4rem;margin:0 0 4px;color:var(--accent)}
.tag{color:var(--dim);margin:0 0 32px}
h2{font-size:1rem;margin:40px 0 12px;padding-bottom:6px;border-bottom:1px dashed var(--line)}
h2 a{color:var(--accent);text-decoration:none;margin-right:6px}
.item{margin:0 0 22px}
h3{font-size:1rem;margin:0}
h3 a{color:var(--fg)}
a{color:var(--fg);text-underline-offset:3px}
a:hover,h3 a:hover{color:var(--accent)}
.url{color:var(--dim);margin:0;overflow-wrap:anywhere;font-size:.9rem}
.note{margin:2px 0 0;padding-left:12px;border-left:2px solid var(--accent);color:var(--dim);font-size:.9rem}
.perk{margin:0 0 0 12px;color:var(--dim);font-size:.9rem}
</style>
</head>
<body>
<main>
<h1>[ ->█ / slotthyyy ]</h1>
<p class="tag">Making things I find interesting</p>

<h2><a href="#content" id="content">#</a>content</h2>
<div class="item"><h3><a href="https://youtube.com/@yourname">youtube</a></h3><p class="url">[ https://youtube.com/@slotthyyy ]</p><p class="note">main channel</p></div>

<h2><a href="#contact" id="contact">#</a>contact</h2>
<div class="item"><h3><a href="mailto:slotthyyy@gmail.com">email</a></h3><p class="url">[ slotthyyy@gmail.com ]</p><p class="note">contact me here</p></div>

</main>
</body>
</html>
